name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start readiness dependencies for verification
        run: npm run compose:ci

      - name: Run Harness and project gate
        run: npm run verify

  publish:
    name: Publish image
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The deployment host is an Oracle Ampere VM, which is arm64; this runner is amd64.
      # Without emulation the published image runs everywhere except the one machine it
      # was built for, and says so only as `exec format error`, at `compose up`, after
      # everything else in the deploy has already succeeded.
      - name: Enable cross-architecture builds
        run: |
          docker run --privileged --rm \
            tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 \
            --install arm64
          docker buildx create --name hotel --use

      # Built for this runner's own architecture and loaded locally, because a
      # multi-platform build cannot be loaded into the daemon - it exists only as a
      # manifest - and the scanner needs an image it can read. One architecture is enough:
      # the findings come from the Alpine packages and the npm tree, which are the same
      # versions on both.
      - name: Build for scanning
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" \
            --load \
            .

      # Before the push, not after. A published image cannot be recalled: anybody who
      # pulled it already has it, and deleting the tag leaves the layers in their cache.
      # Scanning afterwards would tell us what we had already given away.
      #
      # Only fixable findings fail. A gate that blocks on a vulnerability with no
      # available patch is a gate somebody disables, and then it stops catching the ones
      # that do have patches.
      - name: Scan the image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"

      # Rebuilt for both architectures and pushed in one step. Nothing is recompiled: the
      # amd64 layers are in the builder's cache from the scan above, and only arm64 is new.
      - name: Publish to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:main" \
            --push \
            .

      # What the deploy consumes. The digest rather than either tag, because a tag is a
      # pointer somebody can move and this is the record of what was actually built.
      - name: Record the published digest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          {
            echo "### Published image"
            echo
            echo '```'
            echo "tag:    ${IMAGE}"
            echo "digest: ${DIGEST}"
            echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The digest, resolved again here rather than passed between jobs. A job output can
      # be a tag by accident; this asks the registry what `<sha>` actually points at, and
      # a tag cannot survive that.
      - name: Resolve the published digest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY,,}:pull&service=ghcr.io" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).token))')"
          DIGEST="$(curl -fsSI -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.oci.image.index.v1+json" "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/manifests/${GITHUB_SHA}" | tr -d '\r' | awk -F': ' '/^docker-content-digest/ {print $2}')"
          test -n "${DIGEST}"
          echo "APP_IMAGE=${IMAGE}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Point both services at it, and roll back if it cannot answer
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_WORKER_SERVICE_ID }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: node scripts/railway-deploy.mjs
