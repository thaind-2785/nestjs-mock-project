schema_version: '0.2'

project:
  name: nest-mock-project
  repository_type: nestjs_modular_monolith
  source_of_truth: AGENTS.md

entry_commands:
  bootstrap:
    command: npm ci
    integrity_policy: committed_dependency_graph
    permission: restore_locked_dependencies
    tool_ref: npm
    side_effect: dependency_tree
    environments: [local, ci]
  harness_check:
    command: npm run harness:check
    npm_script: harness:check
    permission: run_local_checks
    tool_ref: npm
    side_effect: none
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, TZ]
  harness_test:
    command: npm run test:harness
    npm_script: test:harness
    permission: run_local_checks
    tool_ref: npm
    side_effect: temporary_files
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, TZ]
  harness_eval:
    command: npm run harness:eval
    npm_script: harness:eval
    permission: run_local_checks
    tool_ref: npm
    side_effect: none
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, TZ]
  compose_config:
    command: npm run compose:config
    npm_script: compose:config
    permission: run_local_checks
    tool_ref: docker_compose
    side_effect: none
    environments: [local, ci, compose]
    forward_env: [CI, LANG, LC_ALL, TZ]
  compose_test:
    command: npm run test:compose
    npm_script: test:compose
    permission: run_local_checks
    tool_ref: npm
    side_effect: none
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, TZ]
  compose_smoke:
    command: npm run compose:smoke
    npm_script: compose:smoke
    permission: mutate_local_runtime
    tool_ref: docker_compose
    side_effect: local_process
    environments: [local, compose]
    forward_env: [CI, LANG, LC_ALL, TZ]
  verify:
    command: npm run verify
    npm_script: verify
    permission: run_local_checks
    tool_ref: npm
    side_effect: ignored_artifacts
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, TZ]
  dev:
    command: npm run start:dev
    npm_script: start:dev
    permission: mutate_local_runtime
    tool_ref: npm
    side_effect: local_process
    environments: [local]
    forward_env: [NODE_ENV, PORT]
  build:
    command: npm run build
    npm_script: build
    permission: run_local_checks
    tool_ref: npm
    side_effect: ignored_artifacts
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, NODE_ENV, TZ]
  format_check:
    command: npm run format:check
    npm_script: format:check
    permission: run_local_checks
    tool_ref: npm
    side_effect: none
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, TZ]
  lint_check:
    command: npm run lint:check
    npm_script: lint:check
    permission: run_local_checks
    tool_ref: npm
    side_effect: none
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, TZ]
  unit_test:
    command: npm run test:unit
    npm_script: test:unit
    permission: run_local_checks
    tool_ref: npm
    side_effect: ignored_artifacts
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, NODE_ENV, TZ]
  integration_test:
    command: npm run test:integration
    npm_script: test:integration
    permission: run_local_checks
    tool_ref: npm
    side_effect: ignored_artifacts
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, NODE_ENV, TZ]
  e2e_test:
    command: npm run test:e2e
    npm_script: test:e2e
    permission: run_local_checks
    tool_ref: npm
    side_effect: ignored_artifacts
    environments: [local, ci]
    forward_env: [CI, LANG, LC_ALL, NODE_ENV, TZ]

workflow:
  initial_state: intake
  terminal_states: [complete, blocked]
  state_record: docs/plans
  states:
    - { id: intake, evidence: current user requirement }
    - { id: specified, evidence: accepted feature spec }
    - { id: planned, evidence: risk-aware implementation plan }
    - { id: implementing, evidence: scoped code/docs changes }
    - { id: verifying, evidence: focused and full checks }
    - { id: reviewing, evidence: independent review report }
    - { id: complete, evidence: closed findings and green gate }
    - { id: blocked, evidence: documented external blocker }
  transitions:
    - { from: intake, to: specified, gate: accepted_spec }
    - { from: specified, to: planned, gate: implementation_plan }
    - { from: planned, to: implementing, gate: scope_confirmed }
    - { from: implementing, to: verifying, gate: focused_checks }
    - { from: verifying, to: reviewing, gate: verify }
    - { from: reviewing, to: implementing, gate: findings_to_fix }
    - { from: reviewing, to: complete, gate: independent_approval }
    - { from: implementing, to: blocked, gate: blocker_policy }
    - { from: verifying, to: blocked, gate: blocker_policy }
    - { from: reviewing, to: blocked, gate: blocker_policy }

context_strategy:
  canonical_registry: context_strategy.routes
  mirror_marker: HARNESS_CONTEXT_ROUTES_V0_2
  mirrors:
    - { path: AGENTS.md, role: project_instructions }
    - { path: docs/README.md, role: handbook_router }
    - {
        path: .agents/skills/hotel-backend-delivery/SKILL.md,
        role: delivery_skill,
      }
  precedence:
    - current_user_request
    - AGENTS.md
    - accepted_adrs
    - accepted_feature_spec
    - implementation_plan
    - other_documentation
  sources:
    - { id: project_rules, path: AGENTS.md, load: always }
    - { id: handbook_router, path: docs/README.md, load: non_trivial_work }
    - {
        id: normalized_scope,
        path: docs/product/feature-scope.md,
        load: product_work,
      }
    - {
        id: api_catalog,
        path: docs/api/endpoint-catalog.md,
        load: api_or_integration,
      }
    - {
        id: database_design,
        path: docs/architecture/database.md,
        load: persistence,
      }
    - {
        id: test_strategy,
        path: docs/quality/test-strategy.md,
        load: implementation_or_review,
      }
    - {
        id: accepted_adrs,
        path: docs/decisions,
        path_kind: directory,
        load: persistence_or_architecture,
      }
    - { id: roadmap, path: docs/delivery/roadmap.md, load: sequencing }
    - {
        id: harness_architecture,
        path: docs/harness/architecture.md,
        load: harness_work,
      }
  fallback_route_id: repository_baseline
  fallback_source_ids: [project_rules, handbook_router]
  routes:
    - {
        id: scope_specification,
        task_classes: [scope, specification],
        source_ids: [normalized_scope],
      }
    - {
        id: api_product,
        task_classes: [api, product, integration],
        source_ids: [normalized_scope, api_catalog, test_strategy],
      }
    - {
        id: persistence_concurrency,
        task_classes: [persistence, database, migration, concurrency],
        source_ids: [database_design, accepted_adrs, test_strategy],
      }
    - {
        id: implementation_review,
        task_classes: [implementation, test, review],
        source_ids: [test_strategy],
      }
    - {
        id: sequencing,
        task_classes: [plan, sequencing],
        source_ids: [roadmap, test_strategy],
      }
    - {
        id: harness_runtime,
        task_classes: [harness, runtime_policy],
        source_ids: [harness_architecture, test_strategy],
      }
  policy: load routed sources progressively; never load every document by default

tool_registry:
  - id: node
    kind: runtime
    status: active
    permissions: [run_local_checks]
    timeout_seconds: 900
    implementation_ref: .nvmrc
  - id: npm
    kind: package_and_command_runner
    status: active
    permissions:
      [
        run_local_checks,
        restore_locked_dependencies,
        install_dependencies,
        mutate_local_runtime,
      ]
    timeout_seconds: 900
    implementation_ref: package.json
  - id: git_read
    kind: version_control_read
    status: active
    permissions: [read_repository]
    timeout_seconds: 60
    implementation_ref: .git
  - id: git_write
    kind: version_control_write
    status: active
    permissions: [mutate_repository_history]
    timeout_seconds: 120
    implementation_ref: .git
  - id: docker_compose
    kind: local_service_runtime
    status: active
    permissions: [run_local_checks, mutate_local_runtime]
    timeout_seconds: 600
    implementation_ref: compose.yaml
  - id: typeorm_migrations
    kind: database_schema
    status: planned
    permissions: [mutate_local_data]
    timeout_seconds: 300
  - id: github_actions
    kind: ci
    status: active
    permissions: [ci_read_only]
    timeout_seconds: 1200
    implementation_ref: .github/workflows/ci.yml
  - id: custom_mcp
    kind: external_capability
    status: planned
    permissions: [add_external_capability]
    timeout_seconds: 60
    activation_condition: only after a demonstrated gap not served by repository CLI or API

permission_model:
  actions:
    read_repository: { effect: allow, scope: repository }
    run_local_checks: { effect: allow, scope: non_destructive_commands }
    restore_locked_dependencies:
      { effect: allow, scope: exact_committed_lockfile }
    edit_repository: { effect: task_scoped, scope: requested_change }
    mutate_repository_history:
      { effect: approval_required, scope: explicit_targets }
    install_dependencies:
      { effect: approval_required, scope: declared_packages }
    mutate_local_runtime:
      { effect: allow, scope: registered_local_process_entrypoints }
    mutate_local_data:
      { effect: approval_required, scope: explicit_local_database }
    ci_read_only: { effect: allow, scope: repository_checks }
    call_real_providers: { effect: approval_required, scope: non_ci_only }
    deploy_staging: { effect: approval_required, scope: configured_target }
    deploy_production:
      { effect: approval_required, scope: human_controlled_workflow }
    read_secrets: { effect: deny, scope: never_log_or_commit }
    add_external_capability:
      { effect: approval_required, scope: reviewed_plugin_or_mcp }

hook_lifecycle:
  hooks:
    - id: manifest_changed
      event: before_review
      status: active
      command_ref: harness_check
      failure_policy: block
    - id: harness_regression
      event: before_review
      status: active
      command_ref: harness_test
      failure_policy: block
    - id: local_release_gate
      event: before_handoff
      status: active
      command_ref: verify
      failure_policy: block
    - id: pull_request_gate
      event: pull_request_open_or_update
      status: active
      command_ref: verify
      failure_policy: block

skill_boundaries:
  skills:
    - id: hotel_backend_delivery
      path: .agents/skills/hotel-backend-delivery/SKILL.md
      owns: routing to project sources and delivery workflow
      does_not_own: business decisions, production credentials, deployment approval
  creation_rule: add a skill only for a repeated specialized workflow with distinct inputs and outputs

memory_model:
  records:
    - {
        id: normalized_scope,
        path: docs/product/feature-scope.md,
        lifecycle: owner_approved,
      }
    - { id: specs, path: docs/specs, lifecycle: status_and_git_history }
    - { id: plans, path: docs/plans, lifecycle: updated_per_slice }
    - { id: decisions, path: docs/decisions, lifecycle: append_or_supersede }
    - { id: reviews, path: docs/reviews, lifecycle: immutable_evidence }
    - {
        id: error_log,
        path: docs/logs/error-log.md,
        lifecycle: verified_lessons_only,
      }
  prohibited_content:
    [
      secrets,
      raw_provider_tokens,
      unsanitized_incident_data,
      speculative_errors,
    ]

observability:
  trace_schema_version: '0.2'
  trace_format: json_lines
  allowed_fields:
    [
      schema_version,
      timestamp,
      trace_id,
      event,
      route_id,
      context_source_ids,
      command_ref,
      tool_id,
      permission_id,
      environment_id,
      autonomy_level,
      decision,
      status,
      duration_ms,
      retry_count,
      exit_code,
      failure_class,
    ]
  harness_events:
    - {
        id: policy_decision,
        status: active,
        emitter: scripts/harness-runtime.mjs,
      }
    - {
        id: command_started,
        status: active,
        emitter: scripts/harness-runtime.mjs,
      }
    - {
        id: command_completed,
        status: active,
        emitter: scripts/harness-runtime.mjs,
      }
    - {
        id: command_failed,
        status: active,
        emitter: scripts/harness-runtime.mjs,
      }
    - {
        id: verification_completed,
        status: active,
        emitter: scripts/verify.mjs,
      }
    - {
        id: review_findings_recorded,
        status: manual,
        emitter: docs/templates/review-report.md,
      }
    - {
        id: workflow_state_changed,
        status: manual,
        emitter: active implementation plan,
      }
  sinks:
    - {
        id: local_command_output,
        status: active,
        retention: terminal_session,
        implementation_ref: scripts/harness-runtime.mjs,
      }
    - {
        id: github_check_summary,
        status: active,
        retention: repository_policy,
        implementation_ref: .github/workflows/ci.yml,
      }
    - {
        id: application_json_logs,
        status: planned,
        retention: repository_policy,
        phase: 1,
      }
    - {
        id: queue_and_cron_metrics,
        status: planned,
        retention: repository_policy,
        phase: 5_to_7,
      }
  redact:
    [authorization, cookie, oauth_code, provider_payload, secret, refresh_token]

evaluation_strategy:
  fixture_path: .harness/evaluations.yaml
  evaluations:
    - id: harness_manifest
      command_ref: harness_check
      required: true
      proves: registry references and policy structure are coherent
    - id: harness_regression
      command_ref: harness_test
      required: true
      proves: invalid manifests fail deterministically
    - id: harness_behavior
      command_ref: harness_eval
      required: true
      proves: representative routing policy refusal capability and handoff behavior
    - id: repository_gate
      command_ref: verify
      required: true
      proves: formatting lint tests and build pass together
  future_suites:
    [
      real_dependency_integration,
      auth_contract,
      booking_concurrency,
      deployed_smoke,
    ]

pr_lifecycle:
  host: github
  required_commands: [harness_check, verify]
  steps:
    - scope_and_link_spec_plan
    - locked_dependency_install
    - required_evaluations
    - independent_review
    - disposition_findings
    - merge
  merge_blockers:
    [failed_required_evaluation, unresolved_blocker, unresolved_high]
  merge_enforcement:
    status: external_not_verified
    required_check: Verify repository
    setup_reference: docs/harness/architecture.md#github-merge-protection
  deployment: planned_phase_8

autonomy_levels:
  levels:
    - id: L0
      name: observe_and_check
      status: active
      permissions: [read_repository, run_local_checks]
    - id: L1
      name: plan
      status: active
      permissions: [read_repository, run_local_checks, edit_repository]
    - id: L2
      name: local_implementation
      status: active
      permissions:
        [
          read_repository,
          run_local_checks,
          restore_locked_dependencies,
          edit_repository,
          mutate_local_runtime,
        ]
    - id: L3
      name: non_production_operations
      status: planned
      permissions:
        [
          read_repository,
          run_local_checks,
          edit_repository,
          mutate_local_runtime,
          deploy_staging,
        ]
    - id: L4
      name: production_sensitive
      status: planned
      permissions:
        [
          read_repository,
          run_local_checks,
          edit_repository,
          deploy_staging,
          deploy_production,
        ]
  default: L2
  rule: autonomy never overrides an action permission or explicit approval requirement

runtime_contract:
  node_major: 22
  node_engine: '>=22 <23'
  npm_minimum_major: 10
  npm_engine: '>=10'
  version_file: .nvmrc
  lockfile: package-lock.json
  ci_workflow: .github/workflows/ci.yml
  install_command_ref: bootstrap
  child_environment:
    base_allowlist:
      [
        PATH,
        Path,
        PATHEXT,
        SystemRoot,
        ComSpec,
        WINDIR,
        HOME,
        USERPROFILE,
        APPDATA,
        LOCALAPPDATA,
        TMPDIR,
        TMP,
        TEMP,
      ]
  environments:
    local:
      { status: active, dependencies: [node, npm, git_read, docker_compose] }
    ci:
      {
        status: active,
        dependencies: [node, npm, git_read, github_actions, docker_compose],
      }
    compose:
      { status: active, dependencies: [node, npm, git_read, docker_compose] }
    staging: { status: planned, phase: 8 }
    production: { status: planned, phase: 8 }
