# What runs on the deployed host.
#
# Three things separate this file from `compose.yaml`, and each is the point of a rule
# rather than a preference:
#
# 1. **Nothing is built here.** Every application container runs the image CI published,
#    named by `APP_IMAGE`, which the deploy step sets to a commit-SHA tag. A host that
#    builds is a host that can produce something CI never tested.
#
# 2. **There is no MySQL service.** The database is a managed instance reached over the
#    network. A database container in the file that redeploys the application is a
#    database one `docker compose down -v` destroys, and the only copy of the data this
#    project has.
#
# 3. **Nothing is published to the host except the proxy.** Redis, MinIO, Mailpit and the
#    application itself listen only on the internal network; Caddy is the single door,
#    and it is the only thing holding a certificate.
#
# Usage:
#   docker compose -f compose.production.yaml pull
#   docker compose -f compose.production.yaml run --rm migrate
#   docker compose -f compose.production.yaml up -d

services:
  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      # The certificate's name. `:?` because a Caddyfile whose site address is empty
      # starts and serves nothing, which looks like a network problem for as long as it
      # takes somebody to read the config.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

  api:
    image: ${APP_IMAGE:?set APP_IMAGE to the published commit-SHA tag}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  worker:
    image: ${APP_IMAGE:?set APP_IMAGE to the published commit-SHA tag}
    restart: unless-stopped
    command: [node, dist/worker]
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  # A one-shot container, not a service. `restart: no` and a profile keep it out of
  # `up -d`: it is invoked deliberately by the deploy, before the containers above are
  # replaced, so a migration that fails leaves the previous revision serving.
  migrate:
    image: ${APP_IMAGE:?set APP_IMAGE to the published commit-SHA tag}
    profiles: [migrate]
    restart: 'no'
    command: [npm, run, migration:run:prod]
    env_file: .env
    environment:
      NODE_ENV: production

  redis:
    image: redis:7.4.11-alpine3.21@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --save, '60', '1']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?}
      MINIO_UPDATE: 'off'
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Mail is caught, not delivered. `SPEC-011` records why: a publicly reachable
  # demonstration should not hold a Google application password, and should not be able
  # to send mail to whatever address somebody types into Swagger. The Gmail adapter is
  # unchanged and is a change of environment away.
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  redis_data:
  minio_data:
  mailpit_data:
  caddy_data:
  caddy_config:
