services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_mysql_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_management}
      MYSQL_USER: ${MYSQL_USER:-hotel_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_mysql_change_me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=socket
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine3.21@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --save, '60', '1']
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    # MinIO stopped publishing images: `quay.io/minio/minio` now answers 401 and the Docker
    # Hub repository is gone. This is a source rebuild of the upstream Dockerfile (same
    # entrypoint, `/data` volume and variables) and is used only locally and in CI.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hotel_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_minio_change_me}
      MINIO_UPDATE: 'off'
    ports:
      - 127.0.0.1:${MINIO_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio_data:/data
    healthcheck:
      # The rebuild has no curl; `mc ready` polls the same health endpoint.
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  kafka:
    # Apache's own image, one node acting as both broker and KRaft controller - no
    # ZooKeeper. Pinned to 3.9 rather than 4.x: Kafka 4.0 removed protocol versions
    # (KIP-896) that `kafkajs` still negotiates, and ADR-0012 records the pairing.
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    restart: unless-stopped
    environment:
      # A fixed cluster ID, so the formatted log directory in the volume is accepted on
      # every restart instead of being refused as belonging to another cluster.
      CLUSTER_ID: hotel-local-kraft-cluster1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners, because a client is told to reconnect to the address the
      # broker advertises: `kafka:9092` answers containers on the Compose network, and
      # `127.0.0.1:9094` answers the host, where tests and `npm run start:worker` run.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One node, so every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics exist because the relay created them with a reviewed partition count and
      # retention, never because a client misspelled a name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 127.0.0.1:${KAFKA_PORT:-9094}:9094
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server
          localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # --- the application itself -------------------------------------------------
  #
  # Behind a profile, so `docker compose up` keeps meaning what it has meant for seven
  # phases: start the dependencies, then run the application from the terminal with
  # `npm run start:dev`. Without the profile, every developer who wanted a database
  # would also get an API holding port 3000 against the one they are debugging.
  #
  # `docker compose --profile app up -d` is the whole stack, and it is the check that
  # `OPS-01` asks for: the image built here is the image the deployment runs, so a
  # failure that needs a container to reproduce is reproducible on a laptop.
  api:
    profiles: [app]
    build:
      context: .
    # Named, and named the same as the worker below. Without this, Compose derives an
    # image name per service and builds the identical context twice, producing
    # `<project>-api` and `<project>-worker`: two artifacts where the whole argument for
    # one Dockerfile was that there is one. They would drift the moment a build is not
    # reproducible, which is exactly the failure a single image exists to prevent.
    image: hotel-management:local
    restart: unless-stopped
    env_file:
      # `.env.example` first, as the floor: it carries all 77 names with values that work
      # against these very containers, so a fresh clone brings the stack up without anyone
      # writing a file. `.env` then overrides whatever a developer actually set - it is
      # usually short, because most variables have development defaults, and the image
      # runs NODE_ENV=production where the schema is stricter and those defaults are gone.
      # A missing `.env` is not an error; a missing `.env.example` would be, and it is
      # committed.
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      # Inside the network the dependencies answer to their service names, whatever the
      # host's .env says about reaching them from outside.
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      # Set although the API never connects: the value is validated in every process,
      # and one broker address per network keeps the two containers' summaries equal.
      KAFKA_BROKERS: kafka:9092
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  worker:
    profiles: [app]
    build:
      context: .
    image: hotel-management:local
    restart: unless-stopped
    # The same image, a different command. This is the line that makes "one artifact,
    # two processes" true rather than merely intended.
    command: [node, dist/worker]
    env_file:
      # `.env.example` first, as the floor: it carries all 77 names with values that work
      # against these very containers, so a fresh clone brings the stack up without anyone
      # writing a file. `.env` then overrides whatever a developer actually set - it is
      # usually short, because most variables have development defaults, and the image
      # runs NODE_ENV=production where the schema is stricter and those defaults are gone.
      # A missing `.env` is not an error; a missing `.env.example` would be, and it is
      # committed.
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      KAFKA_BROKERS: kafka:9092
    # No healthcheck, and the absence is deliberate rather than overlooked. The worker
    # has no HTTP surface; the only honest check would be "the process is alive", which
    # is what Docker already reports, and inventing a port to probe would be a check that
    # proves less than it appears to. What it is doing is visible in its JSON logs and in
    # the outbox and ledger rows it writes.
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      # The worker only: it hosts the relay. The API never talks to the broker, so a
      # broker that is down must not stop it from starting (ADR-0012).
      kafka: { condition: service_healthy }

volumes:
  mysql_data:
  redis_data:
  minio_data:
  mailpit_data:
  kafka_data:
